<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time World Population Counter</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            text-align: center;
            background: rgba(255, 255, 255, 0.1);
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(15px);
            max-width: 900px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        h1 {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #00ff88;
            text-shadow: 0 0 15px rgba(0, 255, 136, 0.7);
        }
        
        .subtitle {
            font-size: 1.3rem;
            margin-bottom: 40px;
            opacity: 0.9;
        }
        
        .population-counter {
            font-size: 6rem;
            font-weight: bold;
            margin: 50px 0;
            color: #00ff88;
            text-shadow: 0 0 20px rgba(0, 255, 136, 0.8);
            letter-spacing: 3px;
            font-family: 'Courier New', monospace;
        }
        
        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
            margin: 50px 0;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.15);
            padding: 25px;
            border-radius: 15px;
            transition: all 0.3s ease;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .stat-box:hover {
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        
        .stat-title {
            font-size: 1.1rem;
            margin-bottom: 15px;
            opacity: 0.9;
        }
        
        .stat-value {
            font-size: 2.2rem;
            font-weight: bold;
            color: #00ff88;
            font-family: 'Courier New', monospace;
        }
        
        .update-info {
            margin-top: 40px;
            font-size: 1rem;
            opacity: 0.8;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            display: inline-block;
        }
        
        .counter-animation {
            animation: countUp 0.5s ease-out;
        }
        
        @keyframes countUp {
            0% { transform: scale(1.1); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        .earth-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            color: #00a8ff;
            animation: rotate 20s linear infinite;
        }
        
        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            h1 { font-size: 2.2rem; }
            .population-counter { font-size: 3.5rem; }
            .stats { grid-template-columns: 1fr; }
            .container { padding: 30px 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="earth-icon">🌍</div>
        <h1>REAL TIME WORLD POPULATION</h1>
        <p class="subtitle">Live Global Population Counter</p>
        
        <div class="population-counter" id="populationCounter">
            8,112,698,455
        </div>
        
        <div class="stats">
            <div class="stat-box">
                <div class="stat-title">BIRTHS TODAY</div>
                <div class="stat-value" id="births">156,783</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">DEATHS TODAY</div>
                <div class="stat-value" id="deaths">63,451</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">NET GROWTH TODAY</div>
                <div class="stat-value" id="growth">+93,332</div>
            </div>
        </div>
        
        <div class="update-info">
            Last updated: <span id="updateTime">--:--:--</span> UTC
        </div>
    </div>

    <script>
        // Real-time population simulation based on actual growth rates
        let population = 8112698455; // Current world population estimate
        let birthsToday = 156783;
        let deathsToday = 63451;
        
        function updateCounter() {
            // Realistic growth rates (based on world averages)
            const birthsPerSecond = 4.3;
            const deathsPerSecond = 1.8;
            const netGrowthPerSecond = birthsPerSecond - deathsPerSecond;
            
            // Update values every second
            population += netGrowthPerSecond;
            birthsToday += birthsPerSecond;
            deathsToday += deathsPerSecond;
            
            // Update display with animation
            document.getElementById('populationCounter').textContent = 
                formatNumber(Math.floor(population));
            document.getElementById('populationCounter').classList.add('counter-animation');
            
            document.getElementById('births').textContent = 
                formatNumber(Math.floor(birthsToday));
            document.getElementById('deaths').textContent = 
                formatNumber(Math.floor(deathsToday));
            document.getElementById('growth').textContent = 
                '+' + formatNumber(Math.floor(birthsToday - deathsToday));
            
            document.getElementById('updateTime').textContent = 
                new Date().toUTCString().split(' ')[4];
            
            // Remove animation class after animation completes
            setTimeout(() => {
                document.getElementById('populationCounter').classList.remove('counter-animation');
            }, 500);
        }
        
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
        
        // Update every second for real-time effect
        setInterval(updateCounter, 1000);
        
        // Initial update
        updateCounter();
        
        // Add some visual effects
        document.addEventListener('DOMContentLoaded', function() {
            const boxes = document.querySelectorAll('.stat-box');
            boxes.forEach(box => {
                box.addEventListener('mouseenter', function() {
                    this.style.transform = 'translateY(-10px) scale(1.05)';
                });
                box.addEventListener('mouseleave', function() {
                    this.style.transform = 'translateY(0) scale(1)';
                });
            });
        });
    </script>
</body>
</html>
