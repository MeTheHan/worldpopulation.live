<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canlı Dünya Nüfusu</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d);
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }
        
        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(0, 0, 0, 0.7);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .subtitle {
            font-size: 1.2rem;
            margin-bottom: 30px;
            opacity: 0.9;
        }
        
        .population-counter {
            font-size: 4.5rem;
            font-weight: bold;
            margin: 30px 0;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.7);
            color: #ffcc00;
        }
        
        .stats-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        
        .stat-box {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            transition: transform 0.3s ease;
        }
        
        .stat-box:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }
        
        .stat-title {
            font-size: 1rem;
            margin-bottom: 10px;
            opacity: 0.8;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4cd964;
        }
        
        .update-info {
            margin-top: 30px;
            font-size: 0.9rem;
            opacity: 0.7;
        }
        
        .loading {
            font-size: 1.5rem;
            margin: 20px 0;
        }
        
        .pulse {
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
        
        @media (max-width: 600px) {
            h1 { font-size: 2rem; }
            .population-counter { font-size: 3rem; }
            .container { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DÜNYA NÜFUSU</h1>
        <p class="subtitle">Gerçek zamanlı nüfus sayacı</p>
        
        <div class="population-counter" id="populationCounter">
            <span class="loading pulse">Yükleniyor...</span>
        </div>
        
        <div class="stats-container">
            <div class="stat-box">
                <div class="stat-title">Bugün Doğan</div>
                <div class="stat-value" id="todayBirths">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Bugün Ölen</div>
                <div class="stat-value" id="todayDeaths">-</div>
            </div>
            <div class="stat-box">
                <div class="stat-title">Yılın Büyümesi</div>
                <div class="stat-value" id="yearGrowth">-</div>
            </div>
        </div>
        
        <div class="update-info">
            Son güncelleme: <span id="lastUpdate">-</span>
        </div>
    </div>

    <script>
        // Worldometer'dan veri çekmek için proxy kullanıyoruz
        const PROXY_URL = 'https://api.allorigins.win/raw?url=';
        const WORLDOMETER_URL = 'https://www.worldometers.info/world-population/';
        
        // Başlangıç değerleri
        let worldPopulation = 8110000000;
        let birthsToday = 0;
        let deathsToday = 0;
        let populationGrowth = 0;
        
        // Sayfa yüklendiğinde
        document.addEventListener('DOMContentLoaded', function() {
            // İlk verileri yükle
            fetchWorldometerData();
            
            // Her 30 saniyede bir güncelle
            setInterval(fetchWorldometerData, 30000);
            
            // Her saniye nüfus sayacını güncelle (simülasyon)
            setInterval(updateCounter, 1000);
        });
        
        // Worldometer'dan veri çek
        async function fetchWorldometerData() {
            try {
                document.getElementById('populationCounter').innerHTML = '<span class="loading pulse">Yükleniyor...</span>';
                
                const response = await fetch(PROXY_URL + encodeURIComponent(WORLDOMETER_URL));
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const html = await response.text();
                parseWorldometerData(html);
                
            } catch (error) {
                console.error('Veri alınamadı:', error);
                document.getElementById('populationCounter').innerHTML = '<span style="color: #ff6b6b;">Veri alınamadı</span>';
                
                // Hata durumunda simüle edilmiş verilerle devam et
                useSimulatedData();
            }
        }
        
        // Worldometer HTML'den verileri parse et
        function parseWorldometerData(html) {
            try {
                // Nüfus sayacını bul
                const populationMatch = html.match(/world-population">([\d,]+)</);
                if (populationMatch && populationMatch[1]) {
                    worldPopulation = parseInt(populationMatch[1].replace(/,/g, ''));
                }
                
                // Bugünkü doğumları bul
                const birthsMatch = html.match(/numberof-people-born-this-year">([\d,]+)</);
                if (birthsMatch && birthsMatch[1]) {
                    birthsToday = parseInt(birthsMatch[1].replace(/,/g, ''));
                }
                
                // Bugünkü ölümleri bul
                const deathsMatch = html.match(/number-of-people-who-died-this-year">([\d,]+)</);
                if (deathsMatch && deathsMatch[1]) {
                    deathsToday = parseInt(deathsMatch[1].replace(/,/g, ''));
                }
                
                // Yıllık büyümeyi hesapla
                populationGrowth = birthsToday - deathsToday;
                
                // DOM'u güncelle
                updateDisplay();
                
            } catch (error) {
                console.error('Veri parse edilemedi:', error);
                useSimulatedData();
            }
        }
        
        // Simüle edilmiş veriler kullan
        function useSimulatedData() {
            // Rastgele artışlar
            const randomBirths = Math.floor(Math.random() * 10000) + 150000;
            const randomDeaths = Math.floor(Math.random() * 8000) + 100000;
            
            birthsToday = randomBirths;
            deathsToday = randomDeaths;
            populationGrowth = birthsToday - deathsToday;
            
            // DOM'u güncelle
            updateDisplay();
        }
        
        // Nüfus sayacını güncelle (simülasyon)
        function updateCounter() {
            // Gerçek uygulamada bu değer API'den alınır
            // Bu örnekte saniyede 2.5 kişi artış simüle ediyoruz
            worldPopulation += 2.5;
            
            // DOM'u güncelle
            document.getElementById('populationCounter').textContent = formatNumber(Math.floor(worldPopulation));
        }
        
        // Ekranı güncelle
        function updateDisplay() {
            document.getElementById('populationCounter').textContent = formatNumber(worldPopulation);
            document.getElementById('todayBirths').textContent = formatNumber(birthsToday);
            document.getElementById('todayDeaths').textContent = formatNumber(deathsToday);
            document.getElementById('yearGrowth').textContent = formatNumber(populationGrowth);
            document.getElementById('lastUpdate').textContent = new Date().toLocaleTimeString('tr-TR');
        }
        
        // Sayıları formatla (binlik ayırıcılar ekle)
        function formatNumber(num) {
            return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ",");
        }
    </script>
</body>
</html>
