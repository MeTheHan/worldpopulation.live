<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Canlı Dünya Nüfusu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
      background: linear-gradient(180deg, #0b132b, #1c2541, #3a506b);
      text-shadow: 0 0 6px rgba(0,0,0,0.8);
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    header {
      position: absolute;
      top: 20px;
      text-align: center;
      z-index: 1;
      color: #fff;
    }

    #date {
      font-size: 1.3rem;
      font-weight: bold;
      margin-bottom: 5px;
      letter-spacing: 1px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }

    #clock {
      font-size: 2rem;
      font-weight: bold;
      letter-spacing: 2px;
      text-shadow: 0 0 10px rgba(0,0,0,0.9);
    }

    h1 {
      font-size: 2.6rem;
      margin-bottom: 1rem;
      text-shadow: 0 0 12px rgba(255, 255, 255, 0.3);
      z-index: 1;
    }

    #counter {
      font-size: 3.8rem;
      font-weight: bold;
      text-shadow: 0 0 25px rgba(0, 0, 0, 0.7);
      letter-spacing: 2px;
      margin-bottom: 1rem;
      z-index: 1;
    }

    #stats {
      font-size: 1.3rem;
      font-weight: 600;
      opacity: 0.95;
      margin-bottom: 2.2rem;
      z-index: 1;
    }

    .yt-button {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: all 0.3s ease;
      z-index: 1;
      text-shadow: none;
    }

    .yt-button:hover {
      background: rgba(255, 0, 0, 0.35);
      transform: scale(1.07);
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
    }

    .yt-icon {
      width: 28px;
      height: 20px;
      background: red;
      border-radius: 6px;
      position: relative;
      flex-shrink: 0;
    }

    .yt-icon::after {
      content: '';
      position: absolute;
      top: 4px;
      left: 9px;
      width: 0;
      height: 0;
      border-left: 9px solid white;
      border-top: 6px solid transparent;
      border-bottom: 6px solid transparent;
    }

    footer {
      position: absolute;
      bottom: 10px;
      font-size: 0.9rem;
      opacity: 0.9;
      z-index: 1;
      text-shadow: 0 0 6px rgba(0,0,0,0.9);
    }
  </style>
</head>
<body>
  <canvas id="stars"></canvas>

  <header>
    <div id="date"></div>
    <div id="clock"></div>
  </header>

  <h1>🌎 Canlı Dünya Nüfusu</h1>
  <div id="counter">Yükleniyor...</div>
  <div id="stats">Doğumlar: 0 • Ölümler: 0</div>

  <button class="yt-button" onclick="window.open('https://www.youtube.com/@mtechnow', '_blank')">
    <div class="yt-icon"></div>
    My YouTube Channel
  </button>

  <footer>Kaynak: Dünya tahmini (Worldometer verisine göre)</footer>

  <script>
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    function initStars(count = 150) {
      stars = [];
      for (let i = 0; i < count; i++) {
        stars.push({ x: Math.random()*canvas.width, y: Math.random()*canvas.height, size: Math.random()*1.5+0.3, speed: Math.random()*0.3+0.1, alpha: Math.random() });
      }
    }
    function drawStars() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let s of stars) {
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI*2);
        ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
        ctx.fill();
        s.y += s.speed;
        if (s.y > canvas.height) s.y = 0;
      }
      requestAnimationFrame(drawStars);
    }
    initStars();
    drawStars();

    let time=0;
    function animateBackground(){
      time+=0.002;
      const r1=Math.floor(11+40*Math.sin(time)), g1=Math.floor(19+40*Math.sin(time+1)), b1=Math.floor(43+60*Math.sin(time+2));
      const r2=Math.floor(28+60*Math.sin(time+2)), g2=Math.floor(83+60*Math.sin(time+3)), b2=Math.floor(100+60*Math.sin(time+4));
      document.body.style.background=`linear-gradient(180deg, rgb(${r1},${g1},${b1}), rgb(${r2},${g2},${b2}))`;
      requestAnimationFrame(animateBackground);
    }
    animateBackground();

    let population = 8236000000;
    const perSecondIncrease = 70000000/(365*24*3600);
    const birthPerSecond = 4.3;
    const deathPerSecond = 1.8;
    let births=0, deaths=0;
    function updateCounters(){
      population+=perSecondIncrease/10;
      births+=birthPerSecond/10;
      deaths+=deathPerSecond/10;
      document.getElementById("counter").textContent=Math.floor(population).toLocaleString("tr-TR");
      document.getElementById("stats").textContent=`👶 Doğumlar: ${Math.floor(births).toLocaleString("tr-TR")} • ☠️ Ölümler: ${Math.floor(deaths).toLocaleString("tr-TR")}`;
    }
    setInterval(updateCounters,100);
    updateCounters();

    function updateClock(){
      const now=new Date();
      const options={ weekday:'long', year:'numeric', month:'long', day:'numeric' };
      document.getElementById("date").textContent=now.toLocaleDateString("tr-TR",options);
      document.getElementById("clock").textContent=now.toLocaleTimeString("tr-TR");
    }
    setInterval(updateClock,1000);
    updateClock();
  </script>
</body>
</html>
